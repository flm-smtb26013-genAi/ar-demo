<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- A-Frame v1.5.0 -->
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<!-- MindAR for A-Frame v1.2.5 -->
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
		}
	</style>
</head>

<body>
	<a-scene
		mindar-image="imageTargetSrc: ./top.mind; maxTrack: 1;"
		color-space="sRGB"
		renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">

		<a-assets>
			<img id="site-icon" src="./top.png" />
		</a-assets>

		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

		<!-- ターゲット認識用コンテナ -->
		<a-entity id="ar-target" mindar-image-target="targetIndex: 0">
			
			<!-- ========================================================== -->
			<!-- シネマティック演出グループ（全体を10秒かけてドラマチックに動かす） -->
			<!-- ========================================================== -->
			<a-entity id="cinematic-root" visible="false" scale="0.1 0.1 0.1"
				animation__scale="property: scale; from: 0.1 0.1 0.1; to: 1 1 1; dur: 2000; easing: easeOutExpo; startEvents: playAnimation;"
				animation__float="property: position; from: 0 0 0.1; to: 0 0.2 0.3; dir: alternate; loop: true; dur: 5000; easing: easeInOutSine; startEvents: playAnimation;">

				<!-- ① 背景フレーム（ホームページのブルーを意識したスタイリッシュな枠） -->
				<a-plane 
					width="2.2" height="1.2" position="0 0 0" 
					material="shader: flat; color: #1a365d; opacity: 0.8; transparent: true;"
					animation__fade="property: material.opacity; from: 0; to: 0.8; dur: 1500; startEvents: playAnimation;">
				</a-plane>

				<!-- 枠線（細いホワイトのボーダー表現用） -->
				<a-ring radius-inner="1.0" radius-outer="1.02" position="0 0 0.02"
					material="shader: flat; color: #ffffff; opacity: 0; transparent: true;"
					animation__ring="property: material.opacity; from: 0; to: 0.5; dur: 2000; delay: 500; startEvents: playAnimation;">
				</a-ring>

				<!-- ② 旅を連想させるモチーフ（トップ画像） -->
				<a-plane
					src="#site-icon"
					transparent="true"
					width="1.6"
					height="0.32"
					position="0 0.25 0.05"
					material="shader: flat; opacity: 0;"
					animation__appear="property: material.opacity; from: 0; to: 1; dur: 1500; delay: 800; startEvents: playAnimation;"
					animation__move="property: position; from: 0 0.15 0.05; to: 0 0.25 0.05; dur: 2000; easing: easeOutCubic; startEvents: playAnimation;">
				</a-plane>

				<!-- ③ サブライン・メッセージ（A-Frameのテキスト機能でスタイリッシュに配置） -->
				<a-text
					value="DISCOVER THE EXTRAORDINARY"
					align="center"
					color="#ffffff"
					width="3.5"
					position="0 -0.1 0.05"
					material="shader: flat; opacity: 0;"
					animation__text="property: text.opacity; from: 0; to: 1; dur: 2000; delay: 1500; startEvents: playAnimation;">
				</a-text>

				<!-- ④ 航路をイメージした光のライン（水平線・旅への広がり） -->
				<a-plane
					width="0" height="0.02" position="0 -0.3 0.05"
					material="shader: flat; color: #ffffff;"
					animation__line="property: width; from: 0; to: 1.8; dur: 2000; delay: 2000; easing: easeOutExpo; startEvents: playAnimation;"
					animation__fadeout="property: material.opacity; from: 1; to: 0.3; dur: 3000; delay: 4000; startEvents: playAnimation;">
				</a-plane>

			</a-entity>
		</a-entity>
	</a-scene>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			const targetEntity = document.querySelector("#ar-target");
			const cinematicRoot = document.querySelector("#cinematic-root");

			// マーカーを認識した瞬間に感動的なアニメーションのスイッチを入れる
			targetEntity.addEventListener("targetFound", event => {
				console.log("シネマティック演出スタート");
				cinematicRoot.setAttribute("visible", "true");
				cinematicRoot.setAttribute("scale", "0.1 0.1 0.1");
				
				// わずかにウェイトを置いてから一斉にアニメーションをバーストさせる
				setTimeout(() => {
					cinematicRoot.emit("playAnimation");
				}, 100);
			});

			// マーカーを見失ったらリセット
			targetEntity.addEventListener("targetLost", event => {
				console.log("ターゲットを見失いました");
				cinematicRoot.setAttribute("visible", "false");
			});
		});
	</script>
</body>

</html>
