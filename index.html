<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<!-- A-Frame v1.5.0 -->
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<!-- MindAR for A-Frame v1.2.5 -->
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
			background-color: transparent;
		}

		/* ==========================================
		   ポップアウト型ローディングUI
		   ========================================== */
		#popout-loader {
			position: fixed;
			top: 50%; left: 50%;
			transform: translate(-50%, -50%) scale(0.4);
			opacity: 0;
			background: rgba(34, 69, 113, 0.95);
			border: 2px solid #F0F3FA;
			border-radius: 20px;
			padding: 25px 40px;
			text-align: center;
			color: #F0F3FA;
			z-index: 99999;
			pointer-events: none;
			box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
			font-family: 'Helvetica Neue', Arial, sans-serif;
			/* 飛び出すようなアニメーション（easeOutBack風） */
			transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
		}

		#popout-loader.is-active {
			transform: translate(-50%, -50%) scale(1);
			opacity: 1;
		}

		.loader-title {
			font-size: 26px;
			font-weight: 800;
			letter-spacing: 4px;
			margin-bottom: 15px;
		}

		.loader-track {
			width: 100%;
			height: 3px;
			background: rgba(255, 255, 255, 0.2);
			border-radius: 2px;
			overflow: hidden;
			position: relative;
			margin-bottom: 10px;
		}

		.loader-bar {
			position: absolute;
			top: 0; left: 0;
			height: 100%; width: 0;
			background: #F0F3FA;
			/* ロードバーが伸びるアニメーション */
			transition: width 1.5s cubic-bezier(0.65, 0, 0.35, 1);
		}

		#popout-loader.is-active .loader-bar {
			width: 100%;
		}

		.loader-text {
			font-size: 11px;
			letter-spacing: 2px;
			opacity: 0.8;
		}

		/* ==========================================
		   AR演出オーバーレイ（地球儀 ＆ 飛行機）
		   ========================================== */
		.ar-overlay-container {
			position: absolute;
			top: 0; left: 0; width: 100vw; height: 100vh;
			pointer-events: none;
			z-index: 10;
			display: none;
			overflow: hidden;
		}

		.ar-overlay-container.active {
			display: block;
			animation: fadeInAR 1s ease forwards;
		}

		@keyframes fadeInAR {
			from { opacity: 0; }
			to { opacity: 1; }
		}

		/* --- リアルな世界地図（大陸）付き地球儀 --- */
		.globe-wrapper {
			position: absolute;
			top: 50%; left: 50%;
			transform: translate(-50%, -50%);
			width: 240px; height: 240px;
			border-radius: 50%;
			background-color: rgba(34, 69, 113, 0.85); /* 海の色（ネイビー） */
			overflow: hidden;
			/* 3Dらしい球体の影と立体感を付与 */
			box-shadow: inset -20px -20px 40px rgba(0, 0, 0, 0.6),
						inset 10px 10px 20px rgba(255, 255, 255, 0.3),
						0 15px 40px rgba(0, 0, 0, 0.4);
			z-index: 1;
		}

		.globe-continents {
			position: absolute;
			top: 0; left: 0;
			width: 200%; /* ループさせるため横幅を2倍に */
			height: 100%;
			/* フリーの正確な世界地図SVGを読み込み */
			background-image: url('https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg');
			background-size: 50% 100%;
			background-repeat: repeat-x;
			/* SVGの黒い大陸を白に反転し、少し透過させて馴染ませる */
			filter: invert(1) brightness(100%) opacity(0.8);
			/* 地球の自転アニメーション */
			animation: spinEarth 16s linear infinite;
		}

		@keyframes spinEarth {
			from { transform: translateX(0); }
			to { transform: translateX(-50%); }
		}

		/* --- 飛行機 ＆ 軌跡（白統一・向き完全修正版） --- */
		svg {
			position: absolute;
			top: 0; left: 0;
			width: 100%; height: 100%;
			z-index: 2; 
		}

		.contrail {
			fill: none;
			stroke: #ffffff; /* 白色の飛行機雲 */
			stroke-width: 4px;
			stroke-linecap: round;
			stroke-dasharray: 2500;
			stroke-dashoffset: 2500;
			opacity: 0;
			filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.4));
		}

		.plane-group { 
			opacity: 0; 
			/* 【重要】機首が常に進行方向（カーブの接線）を向く最強のプロパティ */
			offset-rotate: auto 90deg; 
		}

		.is-animating .contrail { animation: drawContrail 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
		.is-animating .plane-group { animation: flyPlane 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

		.plane-icon {
			fill: #ffffff; /* 白色の飛行機 */
			filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
		}

		@keyframes flyPlane {
			0% { offset-distance: 0%; opacity: 0; transform: scale(1.2); }
			10% { opacity: 1; }
			90% { opacity: 1; }
			100% { offset-distance: 100%; opacity: 0; }
		}

		@keyframes drawContrail {
			0% { stroke-dashoffset: 2500; opacity: 0; }
			15% { opacity: 1; }
			85% { opacity: 1; }
			100% { stroke-dashoffset: 0; opacity: 0; }
		}
	</style>
</head>

<body>
	<!-- ポップアウト型 ローディングUI -->
	<div id="popout-loader">
		<div class="loader-title">MONOTRIP</div>
		<div class="loader-track">
			<div class="loader-bar"></div>
		</div>
		<div class="loader-text">Loading Earth...</div>
	</div>

	<!-- ARカメラシーン -->
	<a-scene
		mindar-image="imageTargetSrc: ./top.mind; maxTrack: 1;"
		color-space="sRGB"
		renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">
		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
		<a-entity id="ar-target" mindar-image-target="targetIndex: 0"></a-entity>
	</a-scene>

	<!-- AR演出オーバーレイ -->
	<div id="ar-overlay" class="ar-overlay-container">
		
		<!-- リアルな大陸付き CSS 3D地球儀 -->
		<div class="globe-wrapper">
			<!-- 大陸の地図が自転するレイヤー -->
			<div class="globe-continents"></div>
		</div>

		<!-- 飛行機と軌跡 -->
		<svg viewBox="0 0 1080 1920" preserveAspectRatio="none">
			<path id="flight-path" class="contrail" d="" pathLength="2500" />
			<g id="flight-plane" class="plane-group">
				<g transform="scale(4.5) translate(-12, -21)">
					<path class="plane-icon" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
				</g>
			</g>
		</svg>
	</div>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			const targetEntity = document.querySelector("#ar-target");
			const popoutLoader = document.getElementById("popout-loader");
			const arOverlay = document.getElementById("ar-overlay");
			
			const flightPath = document.getElementById("flight-path");
			const flightPlane = document.getElementById("flight-plane");

			let isTracking = false;
			let flightInterval = null;
			let loadTimeout = null;

			// ルート（js側で回転角度を手動指定しなくて良くなりました）
			const routes = [
				{ path: "M -100,1400 Q 540,600 1180,400" },
				{ path: "M -100,500 Q 540,1300 1180,1400" },
				{ path: "M 1180,1100 Q 540,500 -100,200" } // ルートを1つ追加
			];

			function triggerFlight() {
				if (!isTracking) return;
				const route = routes[Math.floor(Math.random() * routes.length)];
				flightPath.setAttribute("d", route.path);
				
				// アニメーションパスの設定
				flightPlane.style.offsetPath = `path("${route.path}")`;

				arOverlay.classList.remove("is-animating");
				void arOverlay.offsetWidth; // リフロー強制
				arOverlay.classList.add("is-animating");
			}

			// マーカー認識時
			targetEntity.addEventListener("targetFound", () => {
				isTracking = true;
				
				// 1. ローディングUIをポンッとポップアウトさせる
				popoutLoader.classList.add("is-active");

				// 2. 約1.6秒後にローディングを消し、地球儀と飛行機をスタート
				loadTimeout = setTimeout(() => {
					popoutLoader.classList.remove("is-active");

					arOverlay.classList.add("active");
					triggerFlight();

					if (!flightInterval) {
						flightInterval = setInterval(triggerFlight, 4500);
					}
				}, 1600);
			});

			// マーカーロスト時
			targetEntity.addEventListener("targetLost", () => {
				isTracking = false;
				
				clearTimeout(loadTimeout);
				if (flightInterval) {
					clearInterval(flightInterval);
					flightInterval = null;
				}

				popoutLoader.classList.remove("is-active");
				arOverlay.classList.remove("active");
				arOverlay.classList.remove("is-animating");
			});
		});
	</script>
</body>

</html>
