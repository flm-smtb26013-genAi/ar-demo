<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- A-Frame v1.5.0 -->
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<!-- MindAR for A-Frame v1.2.5 -->
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
			background-color: #050b14;
		}

		/* 全画面演出ステージ */
		.beyond-container {
			position: absolute;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			pointer-events: none;
			z-index: 10;
			display: none;
			overflow: hidden;
		}

		.beyond-container.active {
			display: block;
		}

		/* 空間を包み込む光のグラデーション背景オーバーレイ */
		.space-atmosphere {
			position: absolute;
			inset: 0;
			background: radial-gradient(circle at 50% 50%, rgba(30, 58, 115, 0.5) 0%, rgba(5, 11, 20, 0.9) 85%);
			opacity: 0;
			transition: opacity 1.5s ease;
		}
		.beyond-container.active .space-atmosphere {
			opacity: 1;
		}

		svg {
			width: 100%;
			height: 100%;
		}

		/* 巨大な飛行機雲の軌跡 */
		.contrail {
			fill: none;
			stroke: #a5c4ff;
			stroke-width: 4px;
			stroke-linecap: round;
			stroke-dasharray: 2500;
			stroke-dashoffset: 2500;
			opacity: 0;
			filter: drop-shadow(0 0 12px rgba(135, 206, 250, 0.9));
		}

		.plane-group {
			opacity: 0;
		}

		.is-animating .contrail {
			animation: drawContrail 3.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
		}

		.is-animating .plane-group {
			animation: flyPlane 3.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
		}

		/* 巨大機体デザイン */
		.plane-icon {
			fill: #ffffff;
			filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.95));
		}

		/* 世界のモニュメント・観光地シルエット群の流れゆくアニメーション */
		.monument-item {
			position: absolute;
			bottom: 12vh;
			left: -200px;
			fill: rgba(165, 196, 255, 0.85);
			filter: drop-shadow(0 0 10px rgba(30, 144, 255, 0.6));
			opacity: 0;
			width: 110px;
			height: 110px;
			transform: scale(0.6);
			animation: panMonuments 3.5s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
		}

		/* 星屑・光の粒子エフェクト */
		.stardust {
			position: absolute;
			width: 6px;
			height: 6px;
			background: #ffffff;
			border-radius: 50%;
			box-shadow: 0 0 10px #ffffff, 0 0 20px #70a1ff;
			opacity: 0;
			pointer-events: none;
			animation: twinkleStar 2s ease-in-out forwards;
		}

		@keyframes flyPlane {
			0% { offset-distance: 0%; opacity: 0; transform: scale(1.5); }
			10% { opacity: 1; }
			90% { opacity: 1; }
			100% { offset-distance: 100%; opacity: 0; }
		}

		@keyframes drawContrail {
			0% { stroke-dashoffset: 2500; opacity: 0; }
			15% { opacity: 1; }
			85% { opacity: 1; }
			100% { stroke-dashoffset: 0; opacity: 0; }
		}

		@keyframes panMonuments {
			0% {
				left: -150px;
				opacity: 0;
				transform: translateY(30px) scale(0.7);
			}
			20% {
				opacity: 0.9;
				transform: translateY(0px) scale(1);
			}
			80% {
				opacity: 0.9;
				transform: translateY(-10px) scale(1.05);
			}
			100% {
				left: 105vw;
				opacity: 0;
				transform: translateY(-20px) scale(1.1);
			}
		}

		@keyframes twinkleStar {
			0% { transform: scale(0.2); opacity: 0; }
			50% { transform: scale(1.2); opacity: 1; }
			100% { transform: scale(0.5) translateY(-40px); opacity: 0; }
		}
	</style>
</head>

<body>
	<a-scene
		mindar-image="imageTargetSrc: ./top.mind; maxTrack: 1;"
		color-space="sRGB"
		renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">

		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
		<a-entity id="ar-target" mindar-image-target="targetIndex: 0"></a-entity>
	</a-scene>

	<!-- 世界をめぐるダイナミック演出レイヤー -->
	<div id="beyond-overlay" class="beyond-container">
		<div class="space-atmosphere"></div>
		
		<!-- 巨大な飛行機と軌跡のSVG -->
		<svg viewBox="0 0 1920 1080" preserveAspectRatio="none">
			<path id="flight-path" class="contrail" d="" pathLength="2500" />
			<g id="flight-plane" class="plane-group">
				<!-- スケールを大きくして「巨大な飛行機」に拡張 -->
				<g transform="scale(6) translate(-12, -21)">
					<path class="plane-icon" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
				</g>
			</g>
		</svg>

		<!-- 世界のモニュメント・グルメが流れるコンテナ -->
		<div id="monuments-layer" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none;"></div>
		<!-- 星屑レイヤー -->
		<div id="particles-layer" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none;"></div>
	</div>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			const targetEntity = document.querySelector("#ar-target");
			const beyondOverlay = document.getElementById("beyond-overlay");
			const flightPath = document.getElementById("flight-path");
			const flightPlane = document.getElementById("flight-plane");
			const monumentsLayer = document.getElementById("monuments-layer");
			const particlesLayer = document.getElementById("particles-layer");

			let isTracking = false;
			let flightInterval = null;

			// 大空をダイナミックに横切る壮大なルート
			const routes = [
				{ path: "M -100,900 Q 960,200 2020,150", rotate: "auto 45deg" },
				{ path: "M -100,200 Q 960,900 2020,900", rotate: "auto -45deg" }
			];

			// 世界の観光地・建物のSVGシルエット集（エッフェル塔、東京タワー、ピザの斜塔、富士山、自由の女神など）
			const monumentSvgs = [
				// エッフェル塔
				`<svg viewBox="0 0 24 24"><path d="M12 2l2 19h-4l2-19zm-1.5 5h3l-.5 4h-2l-.5-4zm-.8 6h4.6l-.8 6h-3l-.8-6z"/></svg>`,
				// 富士山（山容）
				`<svg viewBox="0 0 24 24"><path d="M2 20l10-16 10 16H2zm10-11l-6 10h12l-6-10z"/></svg>`,
				// 東京タワー / 建造物
				`<svg viewBox="0 0 24 24"><path d="M11 2h2v3h-2V2zm-1 5h4l1 15H9l1-15zm1 3h2v5h-2v-5zm0 7h2v3h-2v-3z"/></svg>`,
				// ピザの斜塔（斜めに傾いた塔）
				`<svg viewBox="0 0 24 24"><path d="M9 3l3-1 2 20h-4L9 3zm-1 5h6v2H8V8zm1 5h4v2H9v-2zm-1 5h6v2H8v-2z" transform="skewX(-10)"/></svg>`,
				// グランドキャニオン・山岳レイヤー
				`<svg viewBox="0 0 24 24"><path d="M2 22l4-8 3 4 5-10 6 14H2z"/></svg>`
			];

			function spawnMonument() {
				if (!isTracking) return;
				const wrapper = document.createElement("div");
				wrapper.className = "monument-item";
				
				// ランダムにモニュメントを選択
				const svgContent = monumentSvgs[Math.floor(Math.random() * monumentSvgs.length)];
				wrapper.innerHTML = svgContent;

				// ランダムな高さ（上下の位置）を調整
				const randomBottom = Math.floor(Math.random() * 40) + 10; // 10vh ~ 50vh
				wrapper.style.bottom = `${randomBottom}vh`;
				
				// アニメーションの速度を少しずつ変える
				wrapper.style.animationDuration = `${Math.random() * 1.5 + 3.0}s`;

				monumentsLayer.appendChild(wrapper);
				setTimeout(() => wrapper.remove(), 4000);
			}

			function spawnStardust() {
				if (!isTracking) return;
				const star = document.createElement("div");
				star.className = "stardust";
				star.style.left = `${Math.random() * 90 + 5}%`;
				star.style.top = `${Math.random() * 80 + 10}%`;
				particlesLayer.appendChild(star);
				setTimeout(() => star.remove(), 2000);
			}

			function triggerSequence() {
				if (!isTracking) return;

				const route = routes[Math.floor(Math.random() * routes.length)];
				flightPath.setAttribute("d", route.path);
				flightPlane.style.offsetPath = `path("${route.path}")`;
				flightPlane.style.offsetRotate = route.rotate;

				beyondOverlay.classList.remove("is-animating");
				void beyondOverlay.offsetWidth;
				beyondOverlay.classList.add("is-animating");

				// 飛行機の飛行に合わせてモニュメントと星屑を次々に流す
				for (let i = 0; i < 4; i++) {
					setTimeout(spawnMonument, i * 700);
				}
				for (let i = 0; i < 6; i++) {
					setTimeout(spawnStardust, i * 250);
				}
			}

			targetEntity.addEventListener("targetFound", () => {
				isTracking = true;
				beyondOverlay.classList.add("active");
				triggerSequence();

				if (!flightInterval) {
					flightInterval = setInterval(triggerSequence, 4500);
				}
			});

			targetEntity.addEventListener("targetLost", () => {
				isTracking = false;
				beyondOverlay.classList.remove("active");
				beyondOverlay.classList.remove("is-animating");
				monumentsLayer.innerHTML = "";
				particlesLayer.innerHTML = "";

				if (flightInterval) {
					clearInterval(flightInterval);
					flightInterval = null;
				}
			});
		});
	</script>
</body>

</html>
