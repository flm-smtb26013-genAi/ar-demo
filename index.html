<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- A-Frame v1.5.0 -->
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<!-- MindAR for A-Frame v1.2.5 -->
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
		}
	</style>
</head>

<body>
	<a-scene
		mindar-image="imageTargetSrc: ./top.mind; maxTrack: 1;"
		color-space="sRGB"
		renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">

		<a-assets>
			<!-- 表示したい画像（2枚目の画像） -->
			<img id="site-icon" src="./top.png" />
		</a-assets>

		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

		<!-- ターゲット認識時にイベントを受け取るため id="ar-target" を付与 -->
		<a-entity id="ar-target" mindar-image-target="targetIndex: 0">
			<!-- 
				【サイズ変更】
				さらに一回り小さくするため、
				width="0.8" height="0.16" に調整しています
			-->
			<a-plane
				id="target-image"
				src="#site-icon"
				transparent="true"
				width="0.8"
				height="0.16"
				position="0 0 0.1"
				material="shader: flat; opacity: 1;"
				visible="false"
				scale="0.1 0.1 0.1"
				animation="property: scale; from: 0.1 0.1 0.1; to: 1 1 1; dur: 800; easing: easeOutBack; startEvents: animateIn;">
			</a-plane>
		</a-entity>
	</a-scene>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			const targetEntity = document.querySelector("#ar-target");
			const targetImage = document.querySelector("#target-image");

			targetEntity.addEventListener("targetFound", event => {
				console.log("ターゲットを認識しました！");
				// 1. まず表示状態をONにする
				targetImage.setAttribute("visible", "true");
				// 2. サイズを一度小さくリセット
				targetImage.setAttribute("scale", "0.1 0.1 0.1");
				
				// 3. 少しだけ遅延させてアニメーション発火
				setTimeout(() => {
					targetImage.emit("animateIn");
				}, 50);
			});

			targetEntity.addEventListener("targetLost", event => {
				console.log("ターゲットを見失いました");
				// 見失ったら非表示に戻す
				targetImage.setAttribute("visible", "false");
			});
		});
	</script>
</body>

</html>
