<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<!-- A-Frame v1.5.0 -->
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<!-- MindAR for A-Frame v1.2.5 -->
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
			background-color: #050b14;
		}

		/* 全画面演出ステージ */
		.beyond-container {
			position: absolute;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			pointer-events: none;
			z-index: 10;
			display: none;
			overflow: hidden;
		}

		.beyond-container.active {
			display: block;
		}

		/* 空間を包み込む光のグラデーション背景 */
		.space-atmosphere {
			position: absolute;
			inset: 0;
			background: radial-gradient(circle at 50% 40%, rgba(30, 60, 130, 0.55) 0%, rgba(5, 11, 20, 0.92) 85%);
			opacity: 0;
			transition: opacity 1.5s ease;
		}
		.beyond-container.active .space-atmosphere {
			opacity: 1;
		}

		svg {
			width: 100%;
			height: 100%;
		}

		/* 飛行機雲の軌跡 */
		.contrail {
			fill: none;
			stroke: #a5c4ff;
			stroke-width: 3.5px;
			stroke-linecap: round;
			stroke-dasharray: 2500;
			stroke-dashoffset: 2500;
			opacity: 0;
			filter: drop-shadow(0 0 10px rgba(135, 206, 250, 0.9));
		}

		.plane-group {
			opacity: 0;
		}

		.is-animating .contrail {
			animation: drawContrail 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
		}

		.is-animating .plane-group {
			animation: flyPlane 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
		}

		/* スマホ画面に合わせた飛行機シルエットサイズ */
		.plane-icon {
			fill: #ffffff;
			filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.95));
		}

		/* スマホの画面幅・サイズ感に合わせて調整したモニュメント群 */
		.monument-item {
			position: absolute;
			bottom: 18vh;
			left: -200px;
			fill: rgba(200, 220, 255, 0.95);
			filter: drop-shadow(0 0 10px rgba(100, 160, 255, 0.8));
			opacity: 0;
			width: 110px;
			height: 110px;
			animation: panMonuments 3.8s linear forwards;
		}

		/* 星屑・光の粒子エフェクト */
		.stardust {
			position: absolute;
			width: 5px;
			height: 5px;
			background: #ffffff;
			border-radius: 50%;
			box-shadow: 0 0 8px #ffffff, 0 0 16px #70a1ff;
			opacity: 0;
			pointer-events: none;
			animation: twinkleStar 2s ease-in-out forwards;
		}

		@keyframes flyPlane {
			0% { offset-distance: 0%; opacity: 0; transform: scale(1.2); }
			10% { opacity: 1; }
			90% { opacity: 1; }
			100% { offset-distance: 100%; opacity: 0; }
		}

		@keyframes drawContrail {
			0% { stroke-dashoffset: 2500; opacity: 0; }
			15% { opacity: 1; }
			85% { opacity: 1; }
			100% { stroke-dashoffset: 0; opacity: 0; }
		}

		@keyframes panMonuments {
			0% {
				left: -150px;
				opacity: 0;
				transform: scale(0.85);
			}
			15% {
				opacity: 1;
				transform: scale(1);
			}
			85% {
				opacity: 1;
				transform: scale(1);
			}
			100% {
				left: 105vw;
				opacity: 0;
				transform: scale(1.05);
			}
		}

		@keyframes twinkleStar {
			0% { transform: scale(0.2); opacity: 0; }
			50% { transform: scale(1.2); opacity: 1; }
			100% { transform: scale(0.5) translateY(-30px); opacity: 0; }
		}
	</style>
</head>

<body>
	<a-scene
		mindar-image="imageTargetSrc: ./top.mind; maxTrack: 1;"
		color-space="sRGB"
		renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">

		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
		<a-entity id="ar-target" mindar-image-target="targetIndex: 0"></a-entity>
	</a-scene>

	<!-- 世界をめぐるダイナミック演出レイヤー -->
	<div id="beyond-overlay" class="beyond-container">
		<div class="space-atmosphere"></div>
		
		<!-- スマホの縦横比に合わせた飛行機ルートのSVG -->
		<svg viewBox="0 0 1080 1920" preserveAspectRatio="none">
			<path id="flight-path" class="contrail" d="" pathLength="2500" />
			<g id="flight-plane" class="plane-group">
				<!-- スマホ画面でベストなバランスになるスケール調整 -->
				<g transform="scale(4.5) translate(-12, -21)">
					<path class="plane-icon" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
				</g>
			</g>
		</svg>

		<!-- 世界のモニュメントシルエットが流れるコンテナ -->
		<div id="monuments-layer" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none;"></div>
		<!-- 星屑レイヤー -->
		<div id="particles-layer" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none;"></div>
	</div>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			const targetEntity = document.querySelector("#ar-target");
			const beyondOverlay = document.getElementById("beyond-overlay");
			const flightPath = document.getElementById("flight-path");
			const flightPlane = document.getElementById("flight-plane");
			const monumentsLayer = document.getElementById("monuments-layer");
			const particlesLayer = document.getElementById("particles-layer");

			let isTracking = false;
			let flightInterval = null;

			// スマホの縦長画面（1080x1920ベース）に合わせたダイナミックなクロスルート
			const routes = [
				{ path: "M -100,1400 Q 540,600 1180,400", rotate: "auto 35deg" },
				{ path: "M -100,500 Q 540,1300 1180,1400", rotate: "auto -35deg" }
			];

			// 世界の名所シルエット集
			const monumentSvgs = [
				// 1. エッフェル塔
				`<svg viewBox="0 0 24 24"><path d="M11 2h2l2 6h-6l2-6zm-1 7h4l1 6h-6l1-6zm-2 7h8l1 6h-10l1-6z"/></svg>`,
				// 2. 富士山
				`<svg viewBox="0 0 24 24"><path d="M2 22l10-16 10 16H2zm10-12l-4 7h8l-4-7z"/></svg>`,
				// 3. 東京タワー
				`<svg viewBox="0 0 24 24"><path d="M11 2h2v3h-2V2zm-1 4h4l1.5 14h-7l1.5-14zm1 3h2v4h-2V9zm0 5h2v5h-2v-5 z"/></svg>`,
				// 4. ピザの斜塔
				`<svg viewBox="0 0 24 24"><path d="M9 3l3-1 2 20h-4L9 3zm-1 5h6v2H8V8zm1 5h4v2H9v-2zm-1 5h6v2H8v-2z" transform="skewX(-8)"/></svg>`,
				// 5. 自由の女神
				`<svg viewBox="0 0 24 24"><path d="M10 2l1 3-2 1-1-2-1 2-2-1 1-3h4zm1 4h2l1 14h-4l1-14zm-2 3h6v2H9V9z"/></svg>`
			];

			function spawnMonument() {
				if (!isTracking) return;
				const wrapper = document.createElement("div");
				wrapper.className = "monument-item";
				
				const svgContent = monumentSvgs[Math.floor(Math.random() * monumentSvgs.length)];
				wrapper.innerHTML = svgContent;

				const randomBottom = Math.floor(Math.random() * 25) + 15;
				wrapper.style.bottom = `${randomBottom}vh`;
				wrapper.style.animationDuration = `${Math.random() * 1.0 + 3.2}s`;

				monumentsLayer.appendChild(wrapper);
				setTimeout(() => wrapper.remove(), 4000);
			}

			function spawnStardust() {
				if (!isTracking) return;
				const star = document.createElement("div");
				star.className = "stardust";
				star.style.left = `${Math.random() * 90 + 5}%`;
				star.style.top = `${Math.random() * 80 + 10}%`;
				particlesLayer.appendChild(star);
				setTimeout(() => star.remove(), 2000);
			}

			function triggerSequence() {
				if (!isTracking) return;

				const route = routes[Math.floor(Math.random() * routes.length)];
				flightPath.setAttribute("d", route.path);
				flightPlane.style.offsetPath = `path("${route.path}")`;
				flightPlane.style.offsetRotate = route.rotate;

				beyondOverlay.classList.remove("is-animating");
				void beyondOverlay.offsetWidth;
				beyondOverlay.classList.add("is-animating");

				for (let i = 0; i < 3; i++) {
					setTimeout(spawnMonument, i * 750);
				}
				for (let i = 0; i < 5; i++) {
					setTimeout(spawnStardust, i * 300);
				}
			}

			targetEntity.addEventListener("targetFound", () => {
				isTracking = true;
				beyondOverlay.classList.add("active");
				triggerSequence();

				if (!flightInterval) {
					flightInterval = setInterval(triggerSequence, 4500);
				}
			});

			targetEntity.addEventListener("targetLost", () => {
				isTracking = false;
				beyondOverlay.classList.remove("active");
				beyondOverlay.classList.remove("is-animating");
				monumentsLayer.innerHTML = "";
				particlesLayer.innerHTML = "";

				if (flightInterval) {
					clearInterval(flightInterval);
					flightInterval = null;
				}
			});
		});
	</script>
</body>

</html>
