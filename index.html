<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
			background-color: transparent;
			font-family: 'Helvetica Neue', Arial, sans-serif;
		}

		/* ==========================================
		   1. ポップアウト型ローディングUI
		   ========================================== */
		#popout-loader {
			position: fixed; top: 50%; left: 50%;
			transform: translate(-50%, -50%) scale(0.4);
			opacity: 0; background: rgba(34, 69, 113, 0.95);
			border: 2px solid #F0F3FA; border-radius: 20px;
			padding: 25px 40px; text-align: center; color: #F0F3FA;
			z-index: 99999; pointer-events: none;
			box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
			transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
		}
		#popout-loader.is-active { transform: translate(-50%, -50%) scale(1); opacity: 1; }
		.loader-title { font-size: 26px; font-weight: 800; letter-spacing: 4px; margin-bottom: 15px; }
		.loader-track { width: 100%; height: 3px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; overflow: hidden; position: relative; margin-bottom: 10px; }
		.loader-bar { position: absolute; top: 0; left: 0; height: 100%; width: 0; background: #F0F3FA; transition: width 1.5s cubic-bezier(0.65, 0, 0.35, 1); }
		#popout-loader.is-active .loader-bar { width: 100%; }
		.loader-text { font-size: 11px; letter-spacing: 2px; opacity: 0.8; }

		/* ==========================================
		   2. ホログラムロゴUI（HUD）
		   ========================================== */
		#hologram-logo {
			position: fixed;
			top: 50%; left: 50%;
			width: 300px;
			/* 中央から少し上に配置し、3Dの奥行きと傾きを持たせる */
			transform: translate(-50%, -60%) perspective(800px) rotateX(15deg) scale(0.9);
			z-index: 1000;
			pointer-events: none;
			display: flex;
			flex-direction: column;
			align-items: center;
			/* 初期は非表示 */
			opacity: 0;
			visibility: hidden;
			transition: opacity 0.5s ease;
			/* ホログラム特有の光彩効果 */
			filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.6));
		}

		/* アクティブ時の表示と、ふわふわ浮かぶアニメーション */
		#hologram-logo.is-playing {
			opacity: 1;
			visibility: visible;
			animation: floatHUD 4s ease-in-out infinite alternate;
		}

		@keyframes floatHUD {
			0% { transform: translate(-50%, -60%) perspective(800px) rotateX(15deg) translateY(0px) scale(0.9); }
			100% { transform: translate(-50%, -60%) perspective(800px) rotateX(15deg) translateY(-15px) scale(0.9); }
		}

		.animated-logo { width: 100%; height: auto; overflow: visible; }
		.part { opacity: 0; animation-fill-mode: forwards; }
		.icon-line { fill: none; stroke: #ffffff; stroke-width: 5; stroke-linecap: round; }

		/* --- クラス付与時（.is-playing）のみアニメーションを発火 --- */
		.is-playing .mountain { animation: fadeUp 1.5s ease-out 0s forwards; }
		.is-playing .hammer {
			transform-origin: 330px 500px;
			animation: strikeDown 0.7s cubic-bezier(0.17, 0.89, 0.32, 1.5) 1.2s forwards;
		}
		.is-playing .compass {
			transform-origin: 287px 267px;
			animation: spinIn 2s cubic-bezier(0.25, 1, 0.5, 1) 1s forwards;
		}
		.is-playing .m-base { animation: fadeIn 1s ease-in-out 2s forwards; }
		.is-playing .comet {
			fill: #2eb896; stroke: none; transform-origin: 287px 283px;
			animation: meteorStrike 0.8s cubic-bezier(0.1, 0.9, 0.2, 1) 2.5s forwards;
		}
		.is-playing .logo-text {
			margin-top: 10px; color: #ffffff; font-size: 28px; font-weight: bold;
			letter-spacing: 5px; opacity: 0;
			animation: fadeIn 1s ease-in-out 4s forwards;
		}

		@keyframes fadeUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
		@keyframes strikeDown {
			0% { opacity: 0; transform: rotate(60deg) translate(50px, -50px); }
			30% { opacity: 1; }
			100% { opacity: 1; transform: rotate(0deg) translate(0, 0); }
		}
		@keyframes spinIn { 0% { opacity: 0; transform: rotate(-180deg) scale(0.8); } 100% { opacity: 1; transform: rotate(0deg) scale(1); } }
		@keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
		@keyframes meteorStrike {
			0% { opacity: 0; transform: translate(600px, -600px) scale(2); }
			40% { opacity: 1; }
			100% { opacity: 1; transform: translate(0, 0) scale(1); }
		}
	</style>
</head>

<body>
	<!-- 1. ローディングUI -->
	<div id="popout-loader">
		<div class="loader-title">MONOTRIP</div>
		<div class="loader-track"><div class="loader-bar"></div></div>
		<div class="loader-text">Loading Earth...</div>
	</div>

	<!-- 2. ホログラムロゴ（ロード後に発火） -->

			<path class="part compass icon-line" d="M519.337 300.279C514.822 344.335 507.781 365.849 489.392 398.652C489.13 399.12 489.278 399.721 489.736 400.002L501.052 406.966C501.527 407.259 502.154 407.099 502.438 406.618C520.606 375.858 527.954 352.75 534.344 300.094C534.388 299.732 534.627 299.414 534.965 299.277L570.721 284.882C571.541 284.552 571.561 283.398 570.753 283.04L538.428 268.724C538.11 268.584 537.887 268.281 537.84 267.937C528.678 200.723 514.257 167.081 469.629 116.8C469.248 116.37 468.574 116.341 468.167 116.747L460.049 124.865C459.689 125.226 459.664 125.808 459.982 126.206C498.274 174.234 510.913 205.698 519.308 267.694C519.371 268.158 519.104 268.613 518.665 268.776L479.959 283.06C479.087 283.382 479.087 284.615 479.959 284.936L518.69 299.23C519.118 299.388 519.384 299.825 519.337 300.279Z" />

			<path class="part mountain icon-line" d="M125.917 430.498L180.722 367.299C181.099 366.865 181.764 366.837 182.176 367.239L222.127 406.228C222.55 406.641 223.237 406.599 223.606 406.138L284.674 329.925C285.062 329.441 285.792 329.423 286.203 329.888L354.143 406.689C354.318 406.887 354.408 407.154 354.391 407.418C353.527 420.799 349.682 422.109 341.3 421.048C341.056 421.017 340.828 420.894 340.668 420.707L286.184 356.897C285.782 356.427 285.055 356.43 284.657 356.904L233.332 418.118C232.673 418.903 233.482 420.053 234.444 419.699L268.229 407.252C268.638 407.101 269.098 407.233 269.365 407.578L280.36 421.78C280.676 422.187 281.249 422.288 281.685 422.013L288.939 417.432C289.593 417.019 290.447 417.476 290.469 418.249C291.005 437.094 290.125 445.384 286.141 451.884C285.793 452.451 284.995 452.486 284.573 451.971L262.941 425.636C262.636 425.266 262.112 425.163 261.691 425.392L233.519 440.672C233.156 440.868 232.709 440.822 232.394 440.554L223.698 433.163C223.27 432.799 222.625 432.859 222.272 433.297L185.417 478.998M170.417 472.498L210.912 421.632C211.206 421.263 211.201 420.737 210.901 420.373L186.137 390.371C185.755 389.908 185.052 389.884 184.639 390.321L134.417 443.498" />

		</svg>
		<div class="logo-text">MONOTRIP</div>
	</div>

	<!-- 3. ARシーン -->
	<a-scene
		mindar-image="imageTargetSrc: ./top.mind; maxTrack: 1; filterMinCF: 0.0005; filterBeta: 0.005;"
		color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
		
		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

		<!-- ARターゲットと地球儀・飛行機 -->
		<a-entity id="ar-target" mindar-image-target="targetIndex: 0">
			<!-- 地球儀の配置を少し下（Y: -0.15）にずらし、ロゴと被らないように調整 -->
			<a-entity id="hologram-group" position="0 -0.15 0" scale="0 0 0" 
					  animation="property: scale; to: 1 1 1; dur: 1200; easing: easeOutElastic; startEvents: popup;">
				
				<a-light type="directional" position="1 2 1" intensity="1.5" color="#ffffff"></a-light>
				<a-light type="ambient" intensity="0.5" color="#ffffff"></a-light>

				<!-- 地球儀 -->
				<a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear;">
					<a-sphere radius="0.25" color="#224571" material="metalness: 0.3; roughness: 0.5"></a-sphere>
					<a-sphere radius="0.26" material="color: #ffffff; wireframe: true; transparent: true; opacity: 0.2" segments-width="18" segments-height="12"></a-sphere>
					<a-entity geometry="primitive: icosahedron; detail: 1" scale="0.27 0.27 0.27" material="color: #ffffff; wireframe: true; transparent: true; opacity: 0.6"></a-entity>
				</a-entity>

				<!-- 飛行機 1 -->
				<a-entity rotation="15 45 0">
					<a-ring radius-inner="0.345" radius-outer="0.35" material="color: #ffffff; transparent: true; opacity: 0.2" rotation="-90 0 0"></a-ring>
					<a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 4500; easing: linear;">
						<a-entity position="0.35 0 0">
							<a-plane width="0.015" height="0.08" color="#ffffff" rotation="-90 0 0" position="0 0 0.01" material="side: double; transparent: true; opacity: 0.95"></a-plane>
							<a-triangle vertex-a="0 0 -0.03" vertex-b="-0.035 0 0.02" vertex-c="0.035 0 0.02" color="#ffffff" material="side: double; transparent: true; opacity: 0.95"></a-triangle>
							<a-triangle vertex-a="0 0 0.03" vertex-b="-0.015 0 0.05" vertex-c="0.015 0 0.05" color="#ffffff" material="side: double; transparent: true; opacity: 0.95"></a-triangle>
							<a-triangle vertex-a="0 0.02 0.04" vertex-b="0 0 0.03" vertex-c="0 0 0.05" color="#ffffff" material="side: double; transparent: true; opacity: 0.95"></a-triangle>
						</a-entity>
					</a-entity>
				</a-entity>

				<!-- 飛行機 2 -->
				<a-entity rotation="70 -30 0">
					<a-ring radius-inner="0.395" radius-outer="0.4" material="color: #ffffff; transparent: true; opacity: 0.2" rotation="-90 0 0"></a-ring>
					<a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 5500; easing: linear;">
						<a-entity position="0.4 0 0">
							<a-plane width="0.015" height="0.08" color="#ffffff" rotation="-90 0 0" position="0 0 0.01" material="side: double; transparent: true; opacity: 0.95"></a-plane>
							<a-triangle vertex-a="0 0 -0.03" vertex-b="-0.035 0 0.02" vertex-c="0.035 0 0.02" color="#ffffff" material="side: double; transparent: true; opacity: 0.95"></a-triangle>
							<a-triangle vertex-a="0 0 0.03" vertex-b="-0.015 0 0.05" vertex-c="0.015 0 0.05" color="#ffffff" material="side: double; transparent: true; opacity: 0.95"></a-triangle>
							<a-triangle vertex-a="0 0.02 0.04" vertex-b="0 0 0.03" vertex-c="0 0 0.05" color="#ffffff" material="side: double; transparent: true; opacity: 0.95"></a-triangle>
						</a-entity>
					</a-entity>
				</a-entity>

				<!-- 飛行機 3 -->
				<a-entity rotation="-45 60 0">
					<a-ring radius-inner="0.445" radius-outer="0.45" material="color: #ffffff; transparent: true; opacity: 0.2" rotation="-90 0 0"></a-ring>
					<a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 6500; easing: linear;">
						<a-entity position="0.45 0 0">
							<a-plane width="0.015" height="0.08" color="#ffffff" rotation="-90 0 0" position="0 0 0.01" material="side: double; transparent: true; opacity: 0.95"></a-plane>
							<a-triangle vertex-a="0 0 -0.03" vertex-b="-0.035 0 0.02" vertex-c="0.035 0 0.02" color="#ffffff" material="side: double; transparent: true; opacity: 0.95"></a-triangle>
							<a-triangle vertex-a="0 0 0.03" vertex-b="-0.015 0 0.05" vertex-c="0.015 0 0.05" color="#ffffff" material="side: double; transparent: true; opacity: 0.95"></a-triangle>
							<a-triangle vertex-a="0 0.02 0.04" vertex-b="0 0 0.03" vertex-c="0 0 0.05" color="#ffffff" material="side: double; transparent: true; opacity: 0.95"></a-triangle>
						</a-entity>
					</a-entity>
				</a-entity>
			</a-entity>
		</a-entity>
	</a-scene>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			const targetEntity = document.querySelector("#ar-target");
			const popoutLoader = document.getElementById("popout-loader");
			const hologramGroup = document.querySelector("#hologram-group");
			const hologramLogo = document.getElementById("hologram-logo");
			let loadTimeout = null;

			// マーカー認識時
			targetEntity.addEventListener("targetFound", () => {
				// 1. ローディング表示
				popoutLoader.classList.add("is-active");

				// 2. ロード完了時（1.6秒後）
				loadTimeout = setTimeout(() => {
					// ローダーを隠す
					popoutLoader.classList.remove("is-active");
					
					// 地球儀をポップアップ
					hologramGroup.emit("popup");
					
					// 同時にHUDロゴアニメーションを開始
					hologramLogo.classList.add("is-playing");
				}, 1600);
			});

			// マーカーロスト時
			targetEntity.addEventListener("targetLost", () => {
				clearTimeout(loadTimeout);
				popoutLoader.classList.remove("is-active");
				hologramGroup.setAttribute("scale", "0 0 0");
				
				// アニメーションをリセット（次に認識した際に最初から再生するため）
				hologramLogo.classList.remove("is-playing");
			});
		});
	</script>
</body>

</html>
