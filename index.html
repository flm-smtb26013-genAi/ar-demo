<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
		}
	</style>
</head>

<body>
	<!-- ... を削除し、正常な属性に修正 -->
	<a-scene
		mindar-image="imageTargetSrc: ./targets.mind;"
		color-space="sRGB"
		renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">

		<a-assets>
			
			<!-- GitHub Pages直下に置くなら ./test.png -->
			<img id="bubble-img" src="./site-icon.png" />
		</a-assets>

		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

		<a-entity mindar-image-target="targetIndex: 0">
			<!-- 写真の上に重なる動画 -->
			<a-video src="#spot-video" width="1" height="0.6" position="0 0 0"></a-video>
			<!-- 浮き上がる吹き出し画像 -->
			<a-plane src="#bubble-img" transparent="true" width="0.5" height="0.3" position="0.4 0.3 0.1"></a-plane>
		</a-entity>
	</a-scene>

	<script>
		// 画面タップで動画再生開始
		window.addEventListener('click', () => {
			const video = document.getElementById('spot-video');
			if (video) {
				video.play();
			}
		});
	</script>
</body>

</html>
