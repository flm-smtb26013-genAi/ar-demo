<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- A-Frame v1.5.0 -->
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<!-- MindAR for A-Frame v1.2.5 -->
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
		}
	</style>
</head>

<body>
	<a-scene
		mindar-image="imageTargetSrc: ./top.mind; maxTrack: 1;"
		color-space="sRGB"
		renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">

		<a-assets>
			<!-- 表示したい画像（2枚目の画像） -->
			<img id="site-icon" src="./top.png" />
		</a-assets>

		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

		<a-entity mindar-image-target="targetIndex: 0">
			<!-- 
				【修正ポイント】 animation属性の記述をセミコロン区切りに統一しました。
				
				動作内容：
				1. 透明度(opacity)が0から1になる（フェードイン）
				2. Z軸方向の位置(position)が奥(0.5)から手前(0.1)に移動する（スライドイン）
				
				delay: 500（0.5秒遅らせて開始）
				dur: 1000（1秒かけてアニメーション）
			-->
			<a-plane
				id="target-image"
				src="#site-icon"
				transparent="true"
				width="2.5"
				height="0.5"
				position="0 0 0.5"
				material="shader: flat; opacity: 0;"
				animation__fade="property: material.opacity; from: 0; to: 1; dur: 1000; startEvents: targetFound;"
				animation__move="property: position; from: 0 0 0.5; to: 0 0 0.1; dur: 1000; easing: easeOutCubic; startEvents: targetFound;">
			</a-plane>
		</a-entity>
	</a-scene>
</body>

</html>
