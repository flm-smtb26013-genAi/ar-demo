<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- A-Frame v1.5.0 -->
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<!-- MindAR for A-Frame v1.2.5 -->
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
		}
	</style>
</head>

<body>
	<a-scene
		mindar-image="imageTargetSrc: ./top.mind; maxTrack: 1;"
		color-space="sRGB"
		renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">

		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

		<!-- ターゲット認識用コンテナ -->
		<a-entity id="ar-target" mindar-image-target="targetIndex: 0">
			
			<!-- シネマティック演出グループ -->
			<a-entity id="cinematic-root" visible="false" scale="0.1 0.1 0.1"
				animation__scale="property: scale; from: 0.1 0.1 0.1; to: 1 1 1; dur: 2000; easing: easeOutExpo; startEvents: playAnimation;"
				animation__float="property: position; from: 0 0 0.1; to: 0 0.15 0.2; dir: alternate; loop: true; dur: 4000; easing: easeInOutSine; startEvents: playAnimation;">

				<!-- ① ホームページのブルーを意識した背景パネル -->
				<a-plane 
					width="2.0" height="0.9" position="0 0 0" 
					material="shader: flat; color: #1a365d; opacity: 0.9; transparent: true;"
					animation__fade="property: material.opacity; from: 0; to: 0.9; dur: 1000; startEvents: playAnimation;">
				</a-plane>

				<!-- ② メインブランド名（MONOTRIP）をテキストでリッチに表現 -->
				<a-text
					value="MONOTRIP"
					align="center"
					color="#ffffff"
					width="3.5"
					position="0 0.15 0.02"
					material="shader: flat; opacity: 0;"
					animation__text="property: text.opacity; from: 0; to: 1; dur: 1200; delay: 300; startEvents: playAnimation;">
				</a-text>

				<!-- ③ スローガン：「Discover the extraordinary」 -->
				<a-text
					value="Discover the extraordinary"
					align="center"
					color="#ffffff"
					width="2.0"
					position="0 -0.1 0.02"
					material="shader: flat; opacity: 0;"
					animation__text="property: text.opacity; from: 0; to: 1; dur: 1200; delay: 600; startEvents: playAnimation;">
				</a-text>

				<!-- ④ スタイリッシュな下部の光のライン -->
				<a-plane
					width="0" height="0.015" position="0 -0.28 0.02"
					material="shader: flat; color: #ffffff;"
					animation__line="property: width; from: 0; to: 1.6; dur: 1500; delay: 900; easing: easeOutExpo; startEvents: playAnimation;">
				</a-plane>

			</a-entity>
		</a-entity>
	</a-scene>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			const targetEntity = document.querySelector("#ar-target");
			const cinematicRoot = document.querySelector("#cinematic-root");

			targetEntity.addEventListener("targetFound", event => {
				console.log("シネマティック演出スタート");
				cinematicRoot.setAttribute("visible", "true");
				cinematicRoot.setAttribute("scale", "0.1 0.1 0.1");
				
				setTimeout(() => {
					cinematicRoot.emit("playAnimation");
				}, 50);
			});

			targetEntity.addEventListener("targetLost", event => {
				console.log("ターゲットを見失いました");
				cinematicRoot.setAttribute("visible", "false");
			});
		});
	</script>
</body>

</html>
