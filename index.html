<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<!-- A-Frame v1.5.0 -->
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<!-- MindAR for A-Frame v1.2.5 -->
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
			background-color: transparent; /* AR用なので背景は透過 */
		}

		/* ==========================================
		   MONOTRIP アニメーションローダー
		   ========================================== */
		#monotrip-loading {
			position: fixed;
			top: 0; left: 0; width: 100vw; height: 100vh;
			background-color: #224571;
			z-index: 99999;
			display: flex; justify-content: center; align-items: center;
			/* 初期状態は画面外（上）に待機 */
			transform: translateY(-100%);
			transition: transform 0.85s cubic-bezier(0.85, 0, 0.15, 1);
			user-select: none;
		}

		#monotrip-loading.is-show {
			transform: translateY(0);
			pointer-events: auto;
		}

		#monotrip-loading.is-hide {
			transform: translateY(-100%);
			pointer-events: none;
		}

		.loading-container { text-align: center; color: #F0F3FA; font-family: 'Helvetica Neue', Arial, sans-serif; }
		
		/* ローディング中のアニメーションリセット用クラス */
		.is-show .loading-tagline {
			display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.45em; color: #F0F3FA;
			opacity: 0; transform: translateY(15px); animation: monoFadeUp 0.8s ease 0.2s forwards; margin-bottom: 8px;
		}
		.is-show .loading-brand {
			font-size: 48px; font-weight: 800; letter-spacing: 0.3em; margin: 0 0 25px 0; display: inline-flex;
		}
		.is-show .loading-brand span {
			display: inline-block; opacity: 0; transform: translateY(100%);
			animation: monoCharUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
		}
		.is-show .loading-brand span:nth-child(1) { animation-delay: 0.30s; }
		.is-show .loading-brand span:nth-child(2) { animation-delay: 0.36s; }
		.is-show .loading-brand span:nth-child(3) { animation-delay: 0.42s; }
		.is-show .loading-brand span:nth-child(4) { animation-delay: 0.48s; }
		.is-show .loading-brand span:nth-child(5) { animation-delay: 0.54s; }
		.is-show .loading-brand span:nth-child(6) { animation-delay: 0.60s; }
		.is-show .loading-brand span:nth-child(7) { animation-delay: 0.66s; }
		.is-show .loading-brand span:nth-child(8) { animation-delay: 0.72s; }
		
		.loading-progress-track {
			width: 220px; height: 1.5px; background: rgba(240, 243, 250, 0.2); margin: 0 auto 16px auto; position: relative; overflow: hidden;
		}
		.is-show .loading-progress-bar {
			position: absolute; top: 0; left: 0; height: 100%; width: 0; background-color: #F0F3FA;
			animation: monoProgress 1.4s cubic-bezier(0.65, 0, 0.35, 1) 0.5s forwards;
		}
		.is-show .loading-status {
			font-size: 11px; letter-spacing: 0.25em; color: rgba(240, 243, 250, 0.7); margin: 0;
			opacity: 0; animation: monoFadeUp 0.6s ease 0.9s forwards;
		}

		@keyframes monoFadeUp { to { opacity: 1; transform: translateY(0); } }
		@keyframes monoCharUp { to { opacity: 1; transform: translateY(0); } }
		@keyframes monoProgress { 0% { width: 0; } 50% { width: 60%; } 100% { width: 100%; } }

		/* ==========================================
		   AR演出オーバーレイ（地球儀 ＆ 飛行機）
		   ========================================== */
		.ar-overlay-container {
			position: absolute;
			top: 0; left: 0; width: 100vw; height: 100vh;
			pointer-events: none;
			z-index: 10;
			display: none;
			overflow: hidden;
		}

		.ar-overlay-container.active {
			display: block;
			animation: fadeInAR 1s ease forwards;
		}

		@keyframes fadeInAR {
			from { opacity: 0; }
			to { opacity: 1; }
		}

		/* --- 3D回転 地球儀（CSSのみで構築するシンプルデザイン） --- */
		.globe-wrapper {
			position: absolute;
			top: 50%; left: 50%;
			transform: translate(-50%, -50%);
			perspective: 1000px; /* 3D空間の奥行き */
			z-index: 1;
		}

		.globe {
			width: 220px; height: 220px;
			border-radius: 50%;
			background: rgba(255, 255, 255, 0.85); /* カメラが見えるよう少しだけ透過させた白シルエット */
			border: 2px solid #224571;
			position: relative;
			transform-style: preserve-3d;
			animation: rotateEarth 12s linear infinite; /* ゆっくり回転 */
			box-shadow: 0 10px 30px rgba(34, 69, 113, 0.2);
		}

		/* 地球の経線（縦のライン）と緯線（横のライン） */
		.globe-ring {
			position: absolute;
			top: 0; left: 0;
			width: 100%; height: 100%;
			border-radius: 50%;
			border: 1.5px solid #224571;
			box-sizing: border-box;
		}

		.globe-ring:nth-child(1) { transform: rotateY(0deg); }
		.globe-ring:nth-child(2) { transform: rotateY(45deg); }
		.globe-ring:nth-child(3) { transform: rotateY(90deg); }
		.globe-ring:nth-child(4) { transform: rotateY(135deg); }
		.globe-ring:nth-child(5) { transform: rotateX(90deg); } /* 赤道 */

		@keyframes rotateEarth {
			from { transform: rotateY(0deg) rotateX(15deg); }
			to { transform: rotateY(360deg) rotateX(15deg); }
		}

		/* --- 飛行機 ＆ 軌跡 --- */
		svg {
			position: absolute;
			top: 0; left: 0;
			width: 100%; height: 100%;
			z-index: 2; /* 地球儀の上を飛ぶように設定 */
		}

		.contrail {
			fill: none;
			stroke: #224571; /* ブランドカラーの紺 */
			stroke-width: 3.5px;
			stroke-linecap: round;
			stroke-dasharray: 2500;
			stroke-dashoffset: 2500;
			opacity: 0;
			filter: drop-shadow(0 4px 6px rgba(34, 69, 113, 0.2));
		}

		.plane-group { opacity: 0; }
		.is-animating .contrail { animation: drawContrail 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
		.is-animating .plane-group { animation: flyPlane 3.5s cubic-bezier(0.25, 1, 0.5, 1) forwards; }

		.plane-icon {
			fill: #224571; /* ブランドカラーの紺 */
			filter: drop-shadow(0 4px 8px rgba(34, 69, 113, 0.3));
		}

		@keyframes flyPlane {
			0% { offset-distance: 0%; opacity: 0; transform: scale(1.2); }
			10% { opacity: 1; }
			90% { opacity: 1; }
			100% { offset-distance: 100%; opacity: 0; }
		}

		@keyframes drawContrail {
			0% { stroke-dashoffset: 2500; opacity: 0; }
			15% { opacity: 1; }
			85% { opacity: 1; }
			100% { stroke-dashoffset: 0; opacity: 0; }
		}
	</style>
</head>

<body>
	<!-- ローディング画面 -->
	<div id="monotrip-loading">
		<div class="loading-container">
			<span class="loading-tagline">TRAVEL ESSENTIALS</span>
			<div class="loading-brand">
				<span>M</span><span>O</span><span>N</span><span>O</span><span>T</span><span>R</span><span>I</span><span>P</span>
			</div>
			<div class="loading-progress-track">
				<div class="loading-progress-bar"></div>
			</div>
			<p class="loading-status">FINDING YOUR JOURNEY...</p>
		</div>
	</div>

	<!-- ARカメラシーン -->
	<a-scene
		mindar-image="imageTargetSrc: ./top.mind; maxTrack: 1;"
		color-space="sRGB"
		renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">
		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
		<a-entity id="ar-target" mindar-image-target="targetIndex: 0"></a-entity>
	</a-scene>

	<!-- 世界をめぐるダイナミック演出レイヤー (地球儀 ＆ 飛行機) -->
	<div id="ar-overlay" class="ar-overlay-container">
		
		<!-- CSS 3D 地球儀（白ベース・紺ライン） -->
		<div class="globe-wrapper">
			<div class="globe">
				<div class="globe-ring"></div>
				<div class="globe-ring"></div>
				<div class="globe-ring"></div>
				<div class="globe-ring"></div>
				<div class="globe-ring"></div>
			</div>
		</div>

		<!-- 飛行機ルートのSVG -->
		<svg viewBox="0 0 1080 1920" preserveAspectRatio="none">
			<path id="flight-path" class="contrail" d="" pathLength="2500" />
			<g id="flight-plane" class="plane-group">
				<g transform="scale(4.5) translate(-12, -21)">
					<path class="plane-icon" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
				</g>
			</g>
		</svg>
	</div>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			const targetEntity = document.querySelector("#ar-target");
			const loadingScreen = document.getElementById("monotrip-loading");
			const arOverlay = document.getElementById("ar-overlay");
			
			const flightPath = document.getElementById("flight-path");
			const flightPlane = document.getElementById("flight-plane");

			let isTracking = false;
			let flightInterval = null;
			let loadTimeout = null;

			// クロスする飛行ルート
			const routes = [
				{ path: "M -100,1400 Q 540,600 1180,400", rotate: "auto 35deg" },
				{ path: "M -100,500 Q 540,1300 1180,1400", rotate: "auto -35deg" }
			];

			function triggerFlight() {
				if (!isTracking) return;
				const route = routes[Math.floor(Math.random() * routes.length)];
				flightPath.setAttribute("d", route.path);
				flightPlane.style.offsetPath = `path("${route.path}")`;
				flightPlane.style.offsetRotate = route.rotate;

				arOverlay.classList.remove("is-animating");
				void arOverlay.offsetWidth; // リフロー強制
				arOverlay.classList.add("is-animating");
			}

			// マーカー認識時
			targetEntity.addEventListener("targetFound", () => {
				isTracking = true;
				
				// 1. まずローディング画面を上からスライドイン
				loadingScreen.classList.remove("is-hide");
				loadingScreen.classList.add("is-show");

				// 2. 約1.8秒後にローディング画面を隠し、AR演出（地球儀＋飛行機）を開始
				loadTimeout = setTimeout(() => {
					loadingScreen.classList.remove("is-show");
					loadingScreen.classList.add("is-hide");

					arOverlay.classList.add("active");
					triggerFlight();

					if (!flightInterval) {
						flightInterval = setInterval(triggerFlight, 4500);
					}
				}, 1800);
			});

			// マーカーロスト時
			targetEntity.addEventListener("targetLost", () => {
				isTracking = false;
				
				// アニメーションやタイマーをリセット
				clearTimeout(loadTimeout);
				if (flightInterval) {
					clearInterval(flightInterval);
					flightInterval = null;
				}

				// 表示をすべて消す
				loadingScreen.classList.remove("is-show");
				loadingScreen.classList.add("is-hide");
				
				arOverlay.classList.remove("active");
				arOverlay.classList.remove("is-animating");
			});
		});
	</script>
</body>

</html>
