<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
		}
	</style>
</head>

<body>
	<a-scene mindar-image="imageTargetSrc: ./targets.mind;" ...>

		<a-assets>
			<!-- ../css/image/ 配下のファイルを指定 -->
			<img id="bubble-img" src="../css/image/test.png" />
		</a-assets>

		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

		<a-entity mindar-image-target="targetIndex: 0">
			<a-video src="#spot-video" width="1" height="0.6" position="0 0 0"></a-video>
			<a-plane src="#bubble-img" transparent="true" width="0.5" height="0.3" position="0.4 0.3 0.1"></a-plane>
		</a-entity>
	</a-scene>

	<script>
		// 画面タップで動画再生開始
		window.addEventListener('click', () => {
			document.getElementById('spot-video').play();
		});
	</script>
</body>

</html>
