<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- A-Frame v1.5.0 -->
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<!-- MindAR for A-Frame v1.2.5 -->
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
			background-color: #050b14;
		}

		/* 全画面演出ステージ */
		.beyond-container {
			position: absolute;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			pointer-events: none;
			z-index: 10;
			display: none;
			overflow: hidden;
		}

		.beyond-container.active {
			display: block;
		}

		/* 空間を包み込む光のグラデーション背景オーバーレイ */
		.space-atmosphere {
			position: absolute;
			inset: 0;
			background: radial-gradient(circle at 50% 50%, rgba(30, 58, 115, 0.4) 0%, rgba(5, 11, 20, 0.85) 80%);
			opacity: 0;
			transition: opacity 1.5s ease;
		}
		.beyond-container.active .space-atmosphere {
			opacity: 1;
		}

		svg {
			width: 100%;
			height: 100%;
		}

		.contrail {
			fill: none;
			stroke: #a5c4ff;
			stroke-width: 3px;
			stroke-linecap: round;
			stroke-dasharray: 2000;
			stroke-dashoffset: 2000;
			opacity: 0;
			filter: drop-shadow(0 0 8px rgba(135, 206, 250, 0.8));
		}

		.plane-group {
			opacity: 0;
		}

		.is-animating .contrail {
			animation: drawContrail 2.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
		}

		.is-animating .plane-group {
			animation: flyPlane 2.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
		}

		.plane-icon {
			fill: #ffffff;
			filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
		}

		/* 星屑・光の粒子エフェクト */
		.stardust {
			position: absolute;
			width: 6px;
			height: 6px;
			background: #ffffff;
			border-radius: 50%;
			box-shadow: 0 0 10px #ffffff, 0 0 20px #70a1ff;
			opacity: 0;
			pointer-events: none;
			animation: twinkleStar 2s ease-in-out forwards;
		}

		/* 想像のちょっと先へ：浮遊するワードタグ（神殿から宇宙への旅をイメージ） */
		.dream-tag {
			position: absolute;
			color: #e8f0fe;
			font-family: sans-serif;
			font-weight: 300;
			font-size: 13px;
			letter-spacing: 3px;
			padding: 8px 18px;
			background: rgba(10, 25, 47, 0.65);
			border: 1px solid rgba(165, 196, 255, 0.3);
			border-radius: 30px;
			backdrop-filter: blur(8px);
			box-shadow: 0 0 20px rgba(30, 144, 255, 0.2);
			opacity: 0;
			transform: translateY(25px) scale(0.85);
			animation: riseDreamTag 3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
		}

		@keyframes flyPlane {
			0% { offset-distance: 0%; opacity: 0; }
			10% { opacity: 1; }
			90% { opacity: 1; }
			100% { offset-distance: 100%; opacity: 0; }
		}

		@keyframes drawContrail {
			0% { stroke-dashoffset: 2000; opacity: 0; }
			15% { opacity: 1; }
			85% { opacity: 1; }
			100% { stroke-dashoffset: 0; opacity: 0; }
		}

		@keyframes twinkleStar {
			0% { transform: scale(0.2); opacity: 0; }
			50% { transform: scale(1.2); opacity: 1; }
			100% { transform: scale(0.5) translateY(-30px); opacity: 0; }
		}

		@keyframes riseDreamTag {
			0% { opacity: 0; transform: translateY(20px) scale(0.9); }
			25% { opacity: 1; transform: translateY(0px) scale(1); }
			75% { opacity: 1; transform: translateY(-10px) scale(1); }
			100% { opacity: 0; transform: translateY(-35px) scale(0.95); }
		}
	</style>
</head>

<body>
	<a-scene
		mindar-image="imageTargetSrc: ./top.mind; maxTrack: 1;"
		color-space="sRGB"
		renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">

		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
		<a-entity id="ar-target" mindar-image-target="targetIndex: 0"></a-entity>
	</a-scene>

	<!-- Beyond a bit 風 演出レイヤー -->
	<div id="beyond-overlay" class="beyond-container">
		<div class="space-atmosphere"></div>
		<svg viewBox="0 0 1920 1080" preserveAspectRatio="none">
			<path id="flight-path" class="contrail" d="" pathLength="2000" />
			<g id="flight-plane" class="plane-group">
				<g transform="scale(3.5) translate(-12, -21)">
					<path class="plane-icon" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
				</g>
			</g>
		</svg>
		<div id="particles-layer" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none;"></div>
	</div>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			const targetEntity = document.querySelector("#ar-target");
			const beyondOverlay = document.getElementById("beyond-overlay");
			const flightPath = document.getElementById("flight-path");
			const flightPlane = document.getElementById("flight-plane");
			const particlesLayer = document.getElementById("particles-layer");

			let isTracking = false;
			let flightInterval = null;

			// 宇宙をめぐるようなダイナミックな曲線ルート
			const routes = [
				{ path: "M -100,1100 Q 960,800 2020,-100", rotate: "auto 90deg" },
				{ path: "M 2020,1100 Q 960,800 -100,-100", rotate: "auto -90deg" },
				{ path: "M 500,-100 Q 200,600 1800,1100", rotate: "auto 45deg" }
			];

			// ワールドの情緒を感じさせるキーワード
			const worldKeywords = [
				"✨ Beyond a bit", "🌌 想像のちょっと先へ", "🌟 星と生きた軌跡", 
				"💫 音楽と光の旅", "🕊️ 静寂の宇宙空間", "💎 始まりの種子"
			];

			function spawnStardust() {
				if (!isTracking) return;
				const star = document.createElement("div");
				star.className = "stardust";
				star.style.left = `${Math.random() * 90 + 5}%`;
				star.style.top = `${Math.random() * 80 + 10}%`;
				particlesLayer.appendChild(star);
				setTimeout(() => star.remove(), 2000);
			}

			function spawnDreamTag() {
				if (!isTracking) return;
				const tag = document.createElement("div");
				tag.className = "dream-tag";
				tag.innerText = worldKeywords[Math.floor(Math.random() * worldKeywords.length)];
				tag.style.left = `${Math.random() * 60 + 20}%`;
				tag.style.top = `${Math.random() * 50 + 25}%`;
				particlesLayer.appendChild(tag);
				setTimeout(() => tag.remove(), 3000);
			}

			function triggerSequence() {
				if (!isTracking) return;

				const route = routes[Math.floor(Math.random() * routes.length)];
				flightPath.setAttribute("d", route.path);
				flightPlane.style.offsetPath = `path("${route.path}")`;
				flightPlane.style.offsetRotate = route.rotate;

				beyondOverlay.classList.remove("is-animating");
				void beyondOverlay.offsetWidth;
				beyondOverlay.classList.add("is-animating");

				// 星屑や言葉をタイミングよく散りばめる
				for (let i = 0; i < 5; i++) {
					setTimeout(spawnStardust, i * 300);
				}
				setTimeout(spawnDreamTag, 500);
				setTimeout(spawnDreamTag, 1400);
			}

			targetEntity.addEventListener("targetFound", () => {
				isTracking = true;
				beyondOverlay.classList.add("active");
				triggerSequence();

				if (!flightInterval) {
					flightInterval = setInterval(triggerSequence, 4000);
				}
			});

			targetEntity.addEventListener("targetLost", () => {
				isTracking = false;
				beyondOverlay.classList.remove("active");
				beyondOverlay.classList.remove("is-animating");
				particlesLayer.innerHTML = "";

				if (flightInterval) {
					clearInterval(flightInterval);
					flightInterval = null;
				}
			});
		});
	</script>
</body>

</html>
