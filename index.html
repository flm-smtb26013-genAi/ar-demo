<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- A-Frame v1.5.0 -->
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<!-- MindAR for A-Frame v1.2.5 -->
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<!-- A-Frame Particle System Component (紙吹雪や雪を表現するライブラリ) -->
	<script src="https://unpkg.com/aframe-particle-system-component@1.1.x/dist/aframe-particle-system-component.min.js"></script>
	
	<style>
		body {
			margin: 0;
			overflow: hidden;
		}
	</style>
</head>

<body>
	<a-scene
		mindar-image="imageTargetSrc: ./top.mind; maxTrack: 1;"
		color-space="sRGB"
		renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">

		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

		<!-- ターゲット認識用コンテナ -->
		<a-entity id="ar-target" mindar-image-target="targetIndex: 0">
			
			<!-- シネマティック演出グループ -->
			<a-entity id="cinematic-root" visible="false" position="0 0 0.5" scale="0.01 0.01 0.01"
				animation__scale="property: scale; from: 0.01 0.01 0.01; to: 1 1 1; dur: 1200; easing: easeOutBack; startEvents: playAnimation;"
				animation__move="property: position; from: 0 0 0.5; to: 0 0 0.1; dur: 1200; easing: easeOutCubic; startEvents: playAnimation;"
				animation__float="property: position; from: 0 0 0.1; to: 0 0.08 0.15; dir: alternate; loop: true; dur: 3000; easing: easeInOutSine; startEvents: startFloating;">

				<!-- ① ホームページのブルーを意識した背景パネル -->
				<a-plane 
					width="2.2" height="1.0" position="0 0 0" 
					material="shader: flat; color: #1a365d; opacity: 0.9; transparent: true;">
				</a-plane>

				<!-- ② メインブランド名（MONOTRIP） -->
				<a-text
					value="MONOTRIP"
					align="center"
					color="#ffffff"
					width="4.0"
					position="0 0.2 0.02">
				</a-text>

				<!-- ③ スローガン：「Discover the extraordinary」 -->
				<a-text
					value="Discover the extraordinary"
					align="center"
					color="#ffffff"
					width="2.2"
					position="0 -0.1 0.02">
				</a-text>

				<!-- ④ スタイリッシュな下部の光のライン -->
				<a-plane
					width="1.8" height="0.015" position="0 -0.3 0.02"
					material="shader: flat; color: #ffffff;">
				</a-plane>

				<!-- ⑤ 紙吹雪（パーティクルシステム） -->
				<!-- color: 白、ホームページのブルー、アクセントのゴールド -->
				<a-entity id="confetti-effect"
					position="0 1 0"
					particle-system="preset: snow; 
					                 color: #ffffff, #1a365d, #ffd700; 
									 particleCount: 70; 
									 maxAge: 2.5; 
									 accelerationValue: 0 -0.8 0; 
									 velocityValue: 0 0.3 0; 
									 particleSize: 0.8;">
				</a-entity>

			</a-entity>
		</a-entity>
	</a-scene>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			const targetEntity = document.querySelector("#ar-target");
			const cinematicRoot = document.querySelector("#cinematic-root");

			targetEntity.addEventListener("targetFound", event => {
				console.log("ターゲットを認識：アニメーション＆紙吹雪開始");
				
				cinematicRoot.setAttribute("visible", "true");
				cinematicRoot.setAttribute("scale", "0.01 0.01 0.01");
				cinematicRoot.setAttribute("position", "0 0 0.5");
				
				setTimeout(() => {
					cinematicRoot.emit("playAnimation");
				}, 50);

				setTimeout(() => {
					cinematicRoot.emit("startFloating");
				}, 1250);
			});

			targetEntity.addEventListener("targetLost", event => {
				console.log("ターゲットを見失いました");
				cinematicRoot.setAttribute("visible", "false");
			});
		});
	</script>
</body>

</html>
