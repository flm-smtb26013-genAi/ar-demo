<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- A-Frame v1.5.0 -->
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<!-- MindAR for A-Frame v1.2.5 -->
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
		}
	</style>
</head>

<body>
	<!-- A-Scene (mystery.mind をターゲットに指定) -->
	<a-scene
		mindar-image="imageTargetSrc: ./mystery.mind; maxTrack: 1;"
		color-space="sRGB"
		renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">

		<a-assets>
			<!-- 表示したい画像（mystery.png） -->
			<img id="mystery-img" src="./mystery.png" />
		</a-assets>

		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

		<!-- ターゲット認識用コンテナ -->
		<a-entity id="ar-target" mindar-image-target="targetIndex: 0">
			<!-- 
				mystery.png のサイズを少し小さく調整 
				（元: width="1.8" height="0.75" → 変更: width="1.4" height="0.58"）
			-->
			<a-plane
				id="mystery-plane"
				src="#mystery-img"
				transparent="true"
				width="1.4"
				height="0.58"
				position="0.8 0.4 0.1"
				material="shader: flat; opacity: 1;"
				visible="false"
				scale="0.1 0.1 0.1"
				animation="property: scale; from: 0.1 0.1 0.1; to: 1 1 1; dur: 800; easing: easeOutBack; startEvents: animateIn;">
			</a-plane>
		</a-entity>
	</a-scene>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			const targetEntity = document.querySelector("#ar-target");
			const mysteryPlane = document.querySelector("#mystery-plane");

			// ターゲットを認識したとき
			targetEntity.addEventListener("targetFound", event => {
				console.log("mystery.mind 認識：画像表示");
				
				// mystery.png を表示し、ポコっと拡大するアニメーションを発火
				mysteryPlane.setAttribute("visible", "true");
				mysteryPlane.setAttribute("scale", "0.1 0.1 0.1");
				setTimeout(() => {
					mysteryPlane.emit("animateIn");
				}, 50);
			});

			// ターゲットを見失ったとき
			targetEntity.addEventListener("targetLost", event => {
				console.log("ターゲットを見失いました");
				
				// mystery.png を非表示
				mysteryPlane.setAttribute("visible", "false");
			});
		});
	</script>
</body>

</html>
