<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
		}
	</style>
</head>

<body>
	<a-scene
		mindar-image="imageTargetSrc: ./top.mind;"
		color-space="sRGB"
		renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">

		<a-assets>
			<!-- 表示したい画像（2枚目の画像） -->
			<img id="site-icon" src="./top.png" />
		</a-assets>

		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

		<a-entity mindar-image-target="targetIndex: 0">
			<!-- 
				animation属性を追加：
				- property: scale（サイズを変化させる）
				- from: 0 0 0（最初は見えない小ささ）
				- to: 1 1 1（元のサイズ）
				- dur: 800（アニメーションにかかる時間：ミリ秒）
				- easing: easeOutBack（少しボヨンと弾むような動き）
			-->
			<a-plane
				src="#site-icon"
				transparent="true"
				width="3.5"
				height="1.0"
				position="0 0 0.1"
				material="shader: flat"
				animation="property: scale; from: 0 0 0; to: 1 1 1; dur: 800; easing: easeOutBack;">
			</a-plane>
		</a-entity>
	</a-scene>
</body>

</html>
