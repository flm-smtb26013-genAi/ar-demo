<!DOCTYPE html>
<html lang="ja">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<!-- A-Frame v1.5.0 -->
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<!-- MindAR for A-Frame v1.2.5 -->
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
			background-color: transparent;
		}

		/* ==========================================
		   ポップアウト型ローディングUI（画面中央固定）
		   ========================================== */
		#popout-loader {
			position: fixed;
			top: 50%; left: 50%;
			transform: translate(-50%, -50%) scale(0.4);
			opacity: 0;
			background: rgba(34, 69, 113, 0.95);
			border: 2px solid #F0F3FA;
			border-radius: 20px;
			padding: 25px 40px;
			text-align: center;
			color: #F0F3FA;
			z-index: 99999;
			pointer-events: none;
			box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
			font-family: 'Helvetica Neue', Arial, sans-serif;
			transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
		}

		#popout-loader.is-active {
			transform: translate(-50%, -50%) scale(1);
			opacity: 1;
		}

		.loader-title { font-size: 26px; font-weight: 800; letter-spacing: 4px; margin-bottom: 15px; }
		.loader-track { width: 100%; height: 3px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; overflow: hidden; position: relative; margin-bottom: 10px; }
		.loader-bar { position: absolute; top: 0; left: 0; height: 100%; width: 0; background: #F0F3FA; transition: width 1.5s cubic-bezier(0.65, 0, 0.35, 1); }
		#popout-loader.is-active .loader-bar { width: 100%; }
		.loader-text { font-size: 11px; letter-spacing: 2px; opacity: 0.8; }
	</style>
</head>

<body>
	<!-- 画面上のローディングUI -->
	<div id="popout-loader">
		<div class="loader-title">MONOTRIP</div>
		<div class="loader-track"><div class="loader-bar"></div></div>
		<div class="loader-text">Loading Earth...</div>
	</div>

	<!-- ARシーン：カメラの手ブレを極限まで抑えるフィルター(filterMinCF/filterBeta)を設定 -->
	<a-scene
		mindar-image="imageTargetSrc: ./top.mind; maxTrack: 1; filterMinCF: 0.0005; filterBeta: 0.005;"
		color-space="sRGB"
		renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">

		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

		<!-- ARマーカーに追従する3D空間 -->
		<a-entity id="ar-target" mindar-image-target="targetIndex: 0">
			
			<!-- マーカーの上に浮かび上がるホログラムグループ（初期はスケール0で見えない） -->
			<a-entity id="hologram-group" position="0 0.2 0" scale="0 0 0" 
					  animation="property: scale; to: 1 1 1; dur: 1200; easing: easeOutElastic; startEvents: popup;">
				
				<!-- 立体感を生むための空間照明 -->
				<a-light type="directional" position="1 2 1" intensity="1.5" color="#ffffff"></a-light>
				<a-light type="ambient" intensity="0.5" color="#ffffff"></a-light>

				<!-- ==========================================
					 1. 3D地球儀（マーカーの真上でゆっくり自転）
					 ========================================== -->
				<a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear;">
					<!-- コア（海）：ネイビーの球体 -->
					<a-sphere radius="0.5" color="#224571" material="metalness: 0.3; roughness: 0.5"></a-sphere>
					
					<!-- 経線・緯線のワイヤーフレーム -->
					<a-sphere radius="0.52" material="color: #ffffff; wireframe: true; transparent: true; opacity: 0.2" segments-width="18" segments-height="12"></a-sphere>
					
					<!-- 仮想大陸：幾何学ポリゴンを重ねる -->
					<a-entity geometry="primitive: icosahedron; detail: 1" scale="0.54 0.54 0.54" material="color: #ffffff; wireframe: true; transparent: true; opacity: 0.6"></a-entity>
				</a-entity>

				<!-- ==========================================
					 2. 飛行機と軌道（地球の周りを3Dで旋回）
					 ========================================== -->
				<a-entity animation="property: rotation; to: 360 360 0; loop: true; dur: 5000; easing: linear;">
					
					<!-- 旋回軌道上の飛行機グループ（地球から0.75離れた位置） -->
					<a-entity position="0.75 0 0" rotation="0 90 90">
						<!-- コードで作る超軽量・ブレゼロのローポリ飛行機（白） -->
						<!-- 胴体 -->
						<a-cone radius-bottom="0.03" height="0.15" color="#ffffff" rotation="90 0 0" position="0 0 0"></a-cone>
						<!-- 主翼 -->
						<a-box width="0.2" height="0.01" depth="0.04" color="#ffffff" position="0 0 0.02"></a-box>
						<!-- 尾翼 -->
						<a-box width="0.06" height="0.03" depth="0.01" color="#ffffff" position="0 0.02 -0.05"></a-box>
					</a-entity>
					
					<!-- 飛行機の軌跡（リング） -->
					<a-ring radius-inner="0.74" radius-outer="0.75" material="color: #ffffff; transparent: true; opacity: 0.3" rotation="90 0 0"></a-ring>
				</a-entity>
			</a-entity>

		</a-entity>
	</a-scene>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			const targetEntity = document.querySelector("#ar-target");
			const popoutLoader = document.getElementById("popout-loader");
			const hologramGroup = document.querySelector("#hologram-group");
			let loadTimeout = null;

			// マーカー認識時
			targetEntity.addEventListener("targetFound", () => {
				// 1. ローディングUIを画面中央に出現させる
				popoutLoader.classList.add("is-active");

				// 2. 約1.6秒後にロード完了
				loadTimeout = setTimeout(() => {
					// ロードUIを消す
					popoutLoader.classList.remove("is-active");
					
					// マーカーの上に3Dホログラムを「ポコッ」と出現させる（popupイベント発火）
					hologramGroup.emit("popup");
				}, 1600);
			});

			// マーカーロスト時
			targetEntity.addEventListener("targetLost", () => {
				clearTimeout(loadTimeout);
				popoutLoader.classList.remove("is-active");
				
				// ホログラムのスケールを0に戻して隠す
				hologramGroup.setAttribute("scale", "0 0 0");
			});
		});
	</script>
</body>

</html>
