<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- A-Frame v1.5.0 -->
	<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
	<!-- MindAR for A-Frame v1.2.5 -->
	<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
	<style>
		body {
			margin: 0;
			overflow: hidden;
		}

		/* 動作確認用のデバッグ表示 */
		#debug-status {
			position: fixed;
			top: 10px;
			left: 50%;
			transform: translateX(-50%);
			background: rgba(0, 0, 0, 0.7);
			color: #fff;
			padding: 6px 16px;
			border-radius: 20px;
			font-size: 14px;
			z-index: 100;
			pointer-events: none;
			font-family: sans-serif;
		}

		/* 全画面SVGフライトステージ（トップ用） */
		.flight-svg-container {
			position: absolute;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			pointer-events: none;
			z-index: 10;
			display: none;
		}

		.flight-svg-container.active {
			display: block;
		}

		.flight-svg-container svg {
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		.contrail {
			fill: none;
			stroke: #F0F3FA;
			stroke-width: 4px;
			stroke-linecap: round;
			stroke-dasharray: 2000;
			stroke-dashoffset: 2000;
			opacity: 0;
		}

		.plane-group {
			opacity: 0;
		}

		.is-animating .contrail {
			animation: drawContrail 2.2s cubic-bezier(0.35, 0, 0.25, 1) forwards;
		}

		.is-animating .plane-group {
			animation: flyPlane 2.2s cubic-bezier(0.35, 0, 0.25, 1) forwards;
		}

		.plane-icon {
			fill: #F0F3FA;
			filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
		}

		@keyframes flyPlane {
			0% { offset-distance: 0%; opacity: 0; }
			5% { opacity: 1; }
			90% { opacity: 1; }
			100% { offset-distance: 100%; opacity: 0; }
		}

		@keyframes drawContrail {
			0% { stroke-dashoffset: 2000; opacity: 0; }
			10% { opacity: 0.9; }
			85% { opacity: 0.9; }
			100% { stroke-dashoffset: 0; opacity: 0; }
		}
	</style>
</head>

<body>
	<!-- ステータス確認用表示 -->
	<div id="debug-status">マーカーを探索中...</div>

	<!-- A-Scene (複数のターゲットをまとめた `targets.mind` または個別指定) 
	     ※もし別々にコンパイルしたファイルを使いたい場合は、1つの統合コンパイルファイルを使用するのが確実です -->
	<a-scene
		mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2;"
		color-space="sRGB"
		renderer="colorManagement: true, physicallyCorrectLights"
		vr-mode-ui="enabled: false"
		device-orientation-permission-ui="enabled: false">

		<a-assets>
			<!-- ミステリーツアー用ポップアップ画像 -->
			<img id="mystery-img" src="./mystery.png" />
		</a-assets>

		<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

		<!-- ターゲット0: トップ用（飛行機発動） -->
		<a-entity id="ar-target-top" mindar-image-target="targetIndex: 0">
			<a-plane visible="false" width="1" height="1"></a-plane>
		</a-entity>

		<!-- ターゲット1: ミステリーツアー用（画像ポップアップ発動） -->
		<a-entity id="ar-target-mystery" mindar-image-target="targetIndex: 1">
			<a-plane
				id="mystery-plane"
				src="#mystery-img"
				transparent="true"
				width="1.4"
				height="0.58"
				position="0.8 0.4 0.1"
				material="shader: flat; opacity: 1;"
				visible="false"
				scale="0.1 0.1 0.1"
				animation="property: scale; from: 0.1 0.1 0.1; to: 1 1 1; dur: 800; easing: easeOutBack; startEvents: animateIn;">
			</a-plane>
		</a-entity>
	</a-scene>

	<!-- 飛行機と軌跡専用のSVGオーバーレイレイヤー -->
	<div id="flight-overlay" class="flight-svg-container">
		<svg viewBox="0 0 1920 1080" preserveAspectRatio="none">
			<path id="flight-path" class="contrail" d="" pathLength="2000" />
			<g id="flight-plane" class="plane-group">
				<g transform="scale(3.5) translate(-12, -21)">
					<path class="plane-icon" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
				</g>
			</g>
		</svg>
	</div>

	<script>
		document.addEventListener("DOMContentLoaded", function() {
			const targetTop = document.querySelector("#ar-target-top");
			const targetMystery = document.querySelector("#ar-target-mystery");
			
			const flightOverlay = document.getElementById("flight-overlay");
			const flightPath = document.getElementById("flight-path");
			const flightPlane = document.getElementById("flight-plane");
			
			const mysteryPlane = document.querySelector("#mystery-plane");
			const debugStatus = document.getElementById("debug-status");

			let isTrackingTop = false;
			let flightInterval = null;

			const routes = [
				{ path: "M -120,1180 Q 960,980 2050,-120", rotate: "auto 90deg" },
				{ path: "M 2050,1180 Q 960,980 -120,-120", rotate: "auto -90deg" },
				{ path: "M -120,-120 Q 960,200 2050,1180", rotate: "auto 90deg" },
				{ path: "M 1000,-120 Q 500,600 100,1180",  rotate: "auto 180deg" }
			];

			function launchFlight() {
				if (!isTrackingTop) return;
				const randomRoute = routes[Math.floor(Math.random() * routes.length)];
				flightPath.setAttribute("d", randomRoute.path);
				flightPlane.style.offsetPath = `path("${randomRoute.path}")`;
				flightPlane.style.offsetRotate = randomRoute.rotate;

				flightOverlay.classList.remove("is-animating");
				void flightOverlay.offsetWidth;
				flightOverlay.classList.add("is-animating");
			}

			// --- トップマーカー（Index 0）のイベント ---
			targetTop.addEventListener("targetFound", event => {
				console.log("トップマーカー認識：飛行機発進");
				debugStatus.textContent = "飛行機AR認識中！";
				debugStatus.style.background = "rgba(0, 128, 0, 0.8)";
				isTrackingTop = true;
				flightOverlay.classList.add("active");

				launchFlight();
				if (!flightInterval) {
					flightInterval = setInterval(launchFlight, 1000);
				}
			});

			targetTop.addEventListener("targetLost", event => {
				debugStatus.textContent = "マーカーを探索中...";
				debugStatus.style.background = "rgba(0, 0, 0, 0.7)";
				isTrackingTop = false;
				flightOverlay.classList.remove("active");
				flightOverlay.classList.remove("is-animating");

				if (flightInterval) {
					clearInterval(flightInterval);
					flightInterval = null;
				}
			});

			// --- ミステリーツアーマーカー（Index 1）のイベント ---
			targetMystery.addEventListener("targetFound", event => {
				console.log("ミステリーマーカー認識：画像ポップアップ");
				debugStatus.textContent = "ミステリーAR認識中！";
				debugStatus.style.background = "rgba(0, 110, 180, 0.8)";

				mysteryPlane.setAttribute("visible", "true");
				mysteryPlane.setAttribute("scale", "0.1 0.1 0.1");
				setTimeout(() => {
					mysteryPlane.emit("animateIn");
				}, 50);
			});

			targetMystery.addEventListener("targetLost", event => {
				debugStatus.textContent = "マーカーを探索中...";
				debugStatus.style.background = "rgba(0, 0, 0, 0.7)";

				mysteryPlane.setAttribute("visible", "false");
			});
		});
	</script>
</body>

</html>
